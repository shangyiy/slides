<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hiring manager lens · Imagine you're the hiring manager, overloaded</title>
  <link rel="stylesheet" href="../style/deck-present.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #eef2f6;
      --surface: #ffffff;
      --ink: #1a2332;
      --muted: #4a5a6e;
      --line: #d0dae6;
      --line-soft: #e4ebf2;
      --accent: #0b6e6e;
      --accent-soft: #e0f2f1;
      --warn: #9a4b1a;
      --warn-bg: #fff4eb;
      --paper: #f7f9fc;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      --body: "Atkinson Hyperlegible", system-ui, sans-serif;
      --display: "Literata", Georgia, serif;
      --measure: 72rem;
      --page: 88rem;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--body);
      font-size: 1.25rem;
      line-height: 1.62;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-underline-offset: 0.15em; }
    .page { max-width: var(--page); margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
    header {
      margin-bottom: 1.75rem;
      padding-bottom: 1.35rem;
      border-bottom: 2px solid var(--ink);
    }
    .meta {
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.02em;
      margin-bottom: 0.7rem;
    }
    h1 {
      font-family: var(--display);
      font-size: clamp(1.75rem, 4vw, 2.35rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
      max-width: 28ch;
      margin-bottom: 0.75rem;
    }
    .lede {
      font-size: 1.12rem;
      color: var(--muted);
      max-width: 58ch;
      line-height: 1.5;
    }
    .facts {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1.15rem;
    }
    .fact {
      font-family: var(--mono);
      font-size: 0.76rem;
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
    }
    section { margin-bottom: 2.5rem; max-width: var(--measure); }
    section > h2 {
      font-family: var(--display);
      font-size: 1.45rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .sec-intent {
      font-size: 1.02rem;
      color: var(--muted);
      margin-bottom: 1rem;
      max-width: 48ch;
    }
    /* Claim illustration — only next to a claim, not section titles */
    .ae .illust {
      margin: 0;
      border-top: 1px solid var(--line-soft);
      background: var(--paper);
    }
    .ae .illust img,
    .ae .illust object {
      display: block;
      width: 100%;
      max-height: 22rem;
      object-fit: contain;
      object-position: center;
      background: #f7f9fc;
    }
    .ae .illust.diagram {
      border-top: 1px solid var(--line-soft);
    }
    .thesis .illust {
      margin-top: 1rem;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--line);
      max-width: 42rem;
    }
    .thesis .illust img {
      display: block;
      width: 100%;
      max-height: 18rem;
      object-fit: contain;
      background: #f7f9fc;
    }
    .thesis .illust figcaption {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      padding: 0.45rem 0.85rem;
      background: var(--paper);
    }
    .ae .illust figcaption {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      padding: 0.45rem 0.85rem 0.55rem;
    }
    section p { margin-bottom: 0.75rem; }
    section ul { margin: 0 0 0.75rem 1.2rem; }
    section li { margin-bottom: 0.35rem; }
    section li::marker { color: var(--accent); }
    .muted { color: var(--muted); }
    .small { font-size: 0.95rem; color: var(--muted); }
    code {
      font-family: var(--mono);
      font-size: 0.88em;
      background: var(--paper);
      border: 1px solid var(--line-soft);
      padding: 0.08em 0.35em;
      border-radius: 4px;
    }

    .thesis {
      background: var(--accent-soft);
      border-left: 5px solid var(--accent);
      padding: 1.1rem 1.25rem;
      border-radius: 0 8px 8px 0;
      margin-bottom: 1.5rem;
      max-width: var(--measure);
    }
    .thesis .lab {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.35rem;
    }
    .thesis p {
      font-family: var(--display);
      font-size: 1.18rem;
      line-height: 1.4;
      margin: 0;
    }

    /* Claim cards (doc) */
    .ae {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      margin: 0.85rem 0;
      overflow: hidden;
    }
    .ae .assert {
      padding: 0.9rem 1.1rem 0.65rem;
    }
    .ae .assert .lab {
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--warn);
      margin-bottom: 0.3rem;
    }
    .ae.key .assert .lab { color: var(--accent); }
    .ae .assert p {
      font-family: var(--display);
      font-size: 1.12rem;
      font-weight: 600;
      line-height: 1.35;
      margin: 0;
    }
    .ae .evidence {
      padding: 0.75rem 1.1rem 1rem;
      background: var(--paper);
      border-top: 1px solid var(--line-soft);
    }
    .ae .evidence p {
      margin: 0 0 0.5rem;
      font-size: 1rem;
      color: var(--muted);
    }
    .ae .evidence ul, .ae .evidence ol {
      margin: 0.2rem 0 0 1.15rem;
      font-size: 1rem;
    }
    .ae .evidence li { margin-bottom: 0.28rem; color: var(--ink); }
    .ae .evidence li::marker { color: var(--accent); }

    .flow {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem;
      margin: 0.75rem 0 1rem;
      font-size: 0.92rem;
    }
    .flow span {
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 0.4rem 0.65rem;
      border-radius: 6px;
    }
    .flow .arr {
      border: none;
      background: none;
      color: var(--accent);
      font-weight: 700;
      padding: 0 0.1rem;
    }
    .flow .you {
      border-color: var(--accent);
      background: var(--accent-soft);
      font-weight: 700;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }
    @media (max-width: 720px) {
      .grid2 { grid-template-columns: 1fr; }
    }
    .gap {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 1rem 1.15rem;
      margin: 0.5rem 0;
    }
    .gap .lab {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.35rem;
    }
    .gap h3 {
      font-family: var(--display);
      font-size: 1.1rem;
      margin: 0 0 0.4rem;
    }
    .gap p { margin: 0; font-size: 0.95rem; color: var(--muted); }

    .open {
      background: var(--warn-bg);
      border: 1px solid #e8c9a8;
      border-radius: 8px;
      padding: 1rem 1.15rem;
    }
    .open .lab {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--warn);
      margin-bottom: 0.4rem;
    }
    .open ul { margin: 0 0 0 1.15rem; }
    .open li { margin-bottom: 0.35rem; color: var(--muted); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.98rem;
      margin: 0.75rem 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      text-align: left;
      padding: 0.55rem 0.7rem;
      border-bottom: 1px solid var(--line-soft);
      vertical-align: top;
    }
    th {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--paper);
      font-weight: 500;
    }
    tr:last-child td { border-bottom: none; }

    footer {
      margin-top: 1.5rem;
      padding-top: 1.1rem;
      border-top: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--muted);
    }

    .mode-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      padding: 0.65rem 0;
      margin: -0.5rem 0 1.25rem;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line-soft);
    }
    .mode-bar .hint {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
    }
    .mode-bar button {
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--surface);
      background: var(--accent);
      border: none;
      border-radius: 6px;
      padding: 0.45rem 0.85rem;
      cursor: pointer;
    }
    .mode-bar button:hover { filter: brightness(1.08); }

    /* presentation styles: see ../style/deck-present.css */

    /* one page per slide + transcript */
    .slide-page {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      margin: 0 0 2rem;
      overflow: hidden;
      max-width: var(--measure);
    }
    .slide-page .slide-num {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0.75rem 1.15rem 0;
    }
    .slide-page .slide-on {
      padding: 0.65rem 1.35rem 1.5rem;
      border-bottom: 1px solid var(--line-soft);
      min-height: 22rem;
    }
    .slide-page .slide-on h2 {
      font-family: var(--display);
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.3;
      margin: 0 0 0.75rem;
      max-width: 100%;
      white-space: normal;
      overflow-wrap: break-word;
    }
    .slide-page .slide-on .body p {
      margin: 0 0 0.45rem;
      color: var(--ink);
      font-size: 1.18rem;
    }
    .slide-page .slide-on .compare-pair {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 0.85rem 1.15rem;
      align-items: stretch;
      margin-top: 0.5rem;
    }
    .slide-page .slide-on .compare-pair .cmp-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      background: var(--paper);
      min-width: 0;
    }
    .slide-page .slide-on .compare-pair .cmp-card .lab {
      font-family: var(--mono);
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.4rem;
    }
    .slide-page .slide-on .compare-pair .cmp-card p {
      margin: 0;
      font-size: 1.12rem;
      line-height: 1.45;
      color: var(--ink);
    }
    @media (max-width: 720px) {
      .slide-page .slide-on .compare-pair {
        grid-template-columns: 1fr;
      }
    }
    .slide-page .slide-on .body ul {
      margin: 0.35rem 0 0.5rem 1.15rem;
    }
    .slide-page .slide-on .body li { margin-bottom: 0.28rem; }
    .slide-page .slide-on .body li::marker { color: var(--accent); }
    .slide-page .slide-on pre {
      font-family: var(--mono);
      font-size: 1.05rem;
      background: var(--paper);
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      line-height: 1.55;
      margin: 0.35rem 0 0.5rem;
      white-space: pre-wrap;
      max-width: 100%;
      overflow-wrap: break-word;
      overflow-x: auto;
    }
    .slide-page .slide-on .grid3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.65rem;
      margin-top: 0.5rem;
    }
    .slide-page .slide-on .split-lr {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      gap: 1rem;
      align-items: center;
      margin-top: 0.35rem;
      min-width: 0;
    }
    .slide-page .slide-on .split-lr figure {
      margin: 0;
      min-width: 0;
    }
    .slide-page .slide-on .split-lr figure img {
      max-height: 26rem;
      max-width: 100%;
      width: 100%;
      object-fit: contain;
    }
    .slide-page .slide-on .split-lr ul {
      margin: 0;
      padding-left: 1.15rem;
      font-size: 1.22rem;
      min-width: 0;
    }
    .slide-page .slide-on .split-lr li {
      margin-bottom: 0.65rem;
      overflow-wrap: break-word;
    }
    @media (max-width: 720px) {
      .slide-page .slide-on .grid3 { grid-template-columns: 1fr; }
      .slide-page .slide-on .split-lr { grid-template-columns: 1fr; }
    }
    .slide-page .slide-on .grid3 .cell {
      background: var(--paper);
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 0.75rem 0.85rem;
    }
    .slide-page .slide-on .grid3 .cell .lab {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.3rem;
    }
    .slide-page .slide-on .grid3 .cell h3 {
      font-family: var(--display);
      font-size: 1.05rem;
      margin: 0 0 0.3rem;
    }
    .slide-page .slide-on .grid3 .cell p {
      margin: 0;
      font-size: 0.95rem;
      color: var(--muted);
    }
    .slide-page .slide-on figure {
      margin: 0.75rem 0 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--line-soft);
    }
    .slide-page .slide-on figure img {
      display: block;
      width: 100%;
      max-height: 28rem;
      object-fit: contain;
      background: #f7f9fc;
    }
    .slide-page .slide-on figure.qr-pair img {
      max-height: 36rem;
      max-width: 100%;
      width: 100%;
      object-fit: contain;
    }
    .slide-page .slide-on .body p,
    .slide-page .slide-on .body li {
      overflow-wrap: break-word;
    }
    .slide-page .slide-on figcaption {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      padding: 0.4rem 0.75rem;
      background: var(--paper);
    }
    .slide-page .transcript {
      background: var(--warn-bg);
      border-top: 1px solid #e8c9a8;
      padding: 1rem 1.35rem 1.35rem;
    }
    .slide-page .transcript .lab {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--warn);
      margin-bottom: 0.4rem;
    }
    .slide-page .transcript p {
      margin: 0 0 0.5rem;
      font-size: 1.1rem;
      color: var(--ink);
      line-height: 1.55;
    }
    .slide-page .transcript p:last-child { margin-bottom: 0; }
    .toc {
      max-width: var(--measure);
      margin: 0 0 1.75rem;
      padding: 1rem 1.15rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .toc .lab {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    .toc ol { margin: 0 0 0 1.2rem; }
    .toc li { margin-bottom: 0.35rem; font-size: 1.1rem; }
    .toc a { text-decoration: none; }
    .toc a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="page">
    <div class="mode-bar">
      <span class="hint"><a href="../index.html">← Talks</a> · <kbd style="font-family:var(--mono);font-size:0.72rem;border:1px solid var(--line);padding:0.1rem 0.3rem;border-radius:3px">P</kbd> present</span>
      <button type="button" id="btn-present">Present</button>
    </div>

    <header>
      <p class="meta">interview · ~10 min</p>
      <h1>Hiring manager lens</h1>
      <p class="lede">Show the hiring manager you’re the right person to help with their problem.</p>
    </header>

    <nav class="toc" id="toc">
      <div class="lab">Slides</div>
      <ol id="toc-list"></ol>
    </nav>

    <div id="pages"></div>

    <footer>
      interview/hiring-manager-lens.html
    </footer>
  </div>

  <div id="deck" hidden>
    <div class="deck-chrome">
      <div>
        <strong id="slide-label">1 / N</strong>
        <span class="keys"> · <kbd>↓</kbd>/<kbd>↑</kbd> or <kbd>→</kbd>/<kbd>←</kbd> · <kbd>Esc</kbd> · <kbd>F</kbd></span>
      </div>
      <span class="end"><a href="../index.html">Talks</a><button type="button" id="btn-exit">Exit</button></span>
    </div>
    <div class="stage" id="stage"></div>
    <div class="progress" id="progress"></div>
  </div>

  <script>
    /**
     * Round-2 script: short transcripts (30–60s/slide). One idea per slide.
     * Title = on screen claim. Body = context. Transcript = speaker guide only.
     */
    const SLIDES = [
      {
        section: "open",
        title: "Imagine you're the hiring manager, overloaded.",
        layout: "img-left",
        img: "images/ev-s1-overloaded.jpg",

        body: [
          "Customers say the service is down",
          "Backlogs keep piling up",
          "On-call is brutal",
        ],
        transcript: [
          "Today, let's switch perspectives.",
          "Imagine you're the hiring manager, not the candidate.",
          "Picture: customers say the service is down, backlogs pile up, on-call is brutal.",
          "Ask the room: what would you do?",
          "Reveal: you get approval to hire — one engineer. That is why this job exists.",
          "Keep this mindset throughout the talk.",
        ],
      },
      {
        section: "open",
        title: "A job description describes the help a team needs.",
        body: [
          "Role: Software Engineer — Data Platforms",
          "Keep distributed systems up under huge traffic",
          "Build shared services other teams can use without hand-holding",
          "Ship clean, tested code others can run and extend",
        ],
        transcript: [
          "Read this JD as the hiring manager. Short form of a public Tesla Data Platforms intern listing.",
          "Ignore the technologies for a moment.",
          "What kind of person would actually solve these problems?",
          "A job description describes the help a team needs, not just the tools they use.",
        ],
      },
      {
        section: "scan",
        title: "Too many resumes force a fast first pass.",
        layout: "img-left",
        body: [
          "About 250 resumes from HR in one week.",
          "Over 1,000 since this role opened.",
        ],
        img: "images/ev-s3-stack-timer.jpg",

        transcript: [
          "Now imagine this role receives 1,000 applications.",
          "You don't have time to deeply read every resume.",
          "The first screen is fast because it has to be.",
        ],
      },
      {
        section: "scan",
        title: "A good resume bullet shows how you solved a problem.",
        layout: "compare",
        a: "Built a Windows game using C++, OOP, and design patterns.",
        b: "Used the Strategy pattern in C++ so new enemy types could be added without changing existing game logic.",
        transcript: [
          "Tell me which one is better — A or B — and why.",
          "Answer key: B. Same project, but B shows the approach and the problem it solved — not just a tool list.",
        ],
      },
      {
        section: "scan",
        title: "A good resume bullet shows how you solved a problem.",
        layout: "compare",
        a: "Implemented a dynamic memory allocator in C.",
        b: "Redesigned the C allocator with segregated free lists, improving throughput by over 5× while keeping high memory utilization.",
        transcript: [
          "Tell me which one is better — A or B — and why.",
          "Answer key: B. Data structure and algorithm choice (segregated free lists) with a clear throughput result — not just “I implemented it in C.”",
        ],
      },
      {
        section: "scan",
        title: "Relevant problems matter more than impressive projects.",
        layout: "img-left",
        body: [
          "A deep project on the right problem beats a shiny project on the wrong one.",
        ],
        img: "images/ev-s5-key-lock.jpg",

        transcript: [
          "Not every strong resume is the right resume for this role.",
          "I'm looking for similar problems, not identical experience.",
          "Example: a recruiter sent a resume that looked impressive — IIT India, a strong US graduate school, top-tier Google coding ranks, GPU runtime optimization work.",
          "They asked if I wanted a phone screen. I said no.",
          "Not because the candidate was weak — those signals were not the ones I need for this hire.",
        ],
      },
      {
        section: "scan",
        title: "Show your contribution clearly.",
        layout: "img-left",
        body: [
          "Don't spend the whole time on project overview or the team's work.",
          "Talk about what you did — the problem you owned and how you solved it.",
        ],
        img: "images/ev-s6-contribution.jpg",

        transcript: [
          "Don't spend the whole time on project overview or the team's work.",
          "Talk about what you did — the problem you owned and how you solved it.",
          "Thirty seconds of overview is enough. Then: what problem did you face, and how did you contribute?",
          "I've seen someone from a school spend fifteen minutes giving me a full project overview. I couldn't stop her. Pure waste of time.",
          "Even though her work was related, the way she described it already failed her.",
          "I don't need the brochure. I need a claim I can test.",
        ],
      },
      {
        section: "probe",
        title: "A bullet-point claim becomes an interview question.",
        layout: "img-left",
        body: [
          "Every bullet on your resume is a promise.",
          "If it's related to the problem the hiring manager is facing, I'll ask about it.",
        ],
        img: "images/ev-s7-flashlight.jpg",

        transcript: [
          "Every bullet on your resume is a promise.",
          "If it's related to the problem the hiring manager is facing, I'll ask about it.",
          "I pick whatever comes first — or the first experience that looks relevant.",
          "So make sure your 1st or 2nd experience has something related — or I may never get there.",
          "If you can't order your work by importance or severity, you're not the right candidate.",
          "If you can't explain it, you failed.",
        ],
      },
      {
        section: "probe",
        title: "Interviews validate your claims.",
        layout: "img-left",
        body: [
          "Tool — why this tool? What problem did it solve?",
          "Design — why this design? What else did you consider?",
          "Result — how do you know? Before, after, how measured?",
        ],
        img: "images/ev-s8-diamond.jpg",

        transcript: [
          "I may ask about the tool.",
          "Or the design.",
          "Or the result.",
          "They're all trying to answer the same question: do you really understand this work?",
        ],
      },
      {
        section: "close",
        title: "The way to pass the interview is to show the hiring manager you're the right person to help.",
        layout: "img-left",
        body: [
          "Every question traces back to: can this person help us?",
          "Read the JD from their side. Show real evidence.",
          "Make a good joint decision easy — yes or no for the right reasons.",
        ],
        img: "images/ev-s9-close.jpg",

        transcript: [
          "The way to pass the interview is to show the hiring manager you're the right person to help.",
          "Remember slide 1 — one overloaded manager, one hire. Your job is to be the obvious help.",
          "The whole path is one lens: team problem → job description → resume → interview → hiring decision.",
          "Every question traces back to one thing: can this person help us?",
          "Read the job description from their perspective. Show evidence you've solved similar problems.",
          "Make it easy for them to believe you — so you and the hiring manager are deciding on the same problem.",
        ],
      },
      {
        section: "close",
        title: "Scan the QR codes for two practice skills.",
        layout: "img-wide",
        img: "images/s10-two-skills-qr.png",

        transcript: [
          "Two skills you can use after this talk — scan either with your phone.",
          "Left: /review-resume — does the paper fit the job?",
          "Right: /resume-deep-dive — do you understand what you wrote?",
          "Use them to practice the hiring-manager lens we just walked through.",
        ],
      },
    ];

    const pages = document.getElementById("pages");
    const tocList = document.getElementById("toc-list");
    const deck = document.getElementById("deck");
    const stage = document.getElementById("stage");
    const progress = document.getElementById("progress");
    const slideLabel = document.getElementById("slide-label");
    let idx = 0;
    let presenting = false;

    function esc(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function rich(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/&lt;strong&gt;/g, "<strong>")
        .replace(/&lt;\/strong&gt;/g, "</strong>")
        .replace(/&lt;code&gt;/g, "<code>")
        .replace(/&lt;\/code&gt;/g, "</code>")
        .replace(/&lt;em&gt;/g, "<em>")
        .replace(/&lt;\/em&gt;/g, "</em>");
    }

    function compareHtml(s, present) {
      if (s.layout !== "compare" || !s.a || !s.b) return "";
      if (present) {
        return `<div class="s-compare">
          <div class="s-card"><div class="lab">A</div><p>${rich(s.a)}</p></div>
          <div class="s-card"><div class="lab">B</div><p>${rich(s.b)}</p></div>
        </div>`;
      }
      return `<div class="compare-pair">
        <div class="cmp-card"><div class="lab">A</div><p>${rich(s.a)}</p></div>
        <div class="cmp-card"><div class="lab">B</div><p>${rich(s.b)}</p></div>
      </div>`;
    }

    function bodyHtml(s) {
      if (s.layout === "compare") return compareHtml(s, false);
      if (s.layout === "img-left" && s.img && s.body && s.body.length) {
        const lis = s.body.map((b) => `<li>${rich(b)}</li>`).join("");
        return `<div class="split-lr">
          <figure>
            <img src="${esc(s.img)}" alt="" />
            ${s.imgCap ? `<figcaption>${esc(s.imgCap)}</figcaption>` : ""}
          </figure>
          <ul>${lis}</ul>
        </div>`;
      }
      if (s.bodyHtml) return s.bodyHtml;
      if (s.body && s.body.length) {
        return `<div class="body">${s.body.map((p) => `<p>${rich(p)}</p>`).join("")}</div>`;
      }
      return "";
    }

    function renderDoc() {
      pages.innerHTML = "";
      tocList.innerHTML = "";
      SLIDES.forEach((s, i) => {
        const n = i + 1;
        const id = `slide-${n}`;
        const li = document.createElement("li");
        li.innerHTML = `<a href="#${id}">${esc(s.title)}</a>`;
        tocList.appendChild(li);

        const split = s.layout === "img-left";
        const figClass = s.layout === "img-wide" ? " class=\"qr-pair\"" : "";
        const fig =
          !split && s.img
            ? `<figure${figClass}><img src="${esc(s.img)}" alt="" />${
                s.imgCap ? `<figcaption>${esc(s.imgCap)}</figcaption>` : ""
              }</figure>`
            : "";
        const notes = (s.transcript || [])
          .map((p) => `<p>${rich(p)}</p>`)
          .join("");

        const el = document.createElement("article");
        el.className = "slide-page";
        el.id = id;
        el.innerHTML = `
          <div class="slide-num">Slide ${n} / ${SLIDES.length}</div>
          <div class="slide-on">
            <h2>${esc(s.title)}</h2>
            ${bodyHtml(s)}
            ${fig}
          </div>
          <div class="transcript">
            <div class="lab">Transcript</div>
            ${notes}
          </div>`;
        pages.appendChild(el);
      });
    }

    function renderPresent(s) {
      let html = `<div class="s-ae">
        <div class="s-assert"><p>${rich(s.title || "")}</p></div>`;
      let ev = "";
      if (s.layout === "compare") {
        ev = compareHtml(s, true);
      } else if (s.layout === "img-left" && s.img && s.body && s.body.length) {
        ev = `<div class="s-split">
          <img src="${esc(s.img)}" alt="" />
          <ul>${s.body.map((b) => `<li>${rich(b)}</li>`).join("")}</ul>
        </div>`;
      } else if (s.bodyHtml) {
        ev = s.bodyHtml;
      } else if (s.body && s.body.length) {
        ev = `<ul>${s.body.map((b) => `<li>${rich(b)}</li>`).join("")}</ul>`;
      }
      if (ev) html += `<div class="s-ev">${ev}</div>`;
      if (s.img && s.layout !== "img-left") {
        const wide = s.layout === "img-wide" ? " s-illust-wide" : "";
        html += `<div class="s-illust${wide}"><img src="${esc(s.img)}" alt="" /></div>`;
      }
      html += `</div>`;
      return html;
    }

    function paint() {
      const s = SLIDES[idx];
      stage.innerHTML = `<div class="slide active">${renderPresent(s)}</div>`;
      slideLabel.textContent = `${idx + 1} / ${SLIDES.length}`;
      progress.style.width = `${((idx + 1) / SLIDES.length) * 100}%`;
    }

    function enterPresent(startAt = 0) {
      presenting = true;
      idx = Math.max(0, Math.min(startAt, SLIDES.length - 1));
      document.body.classList.add("presenting");
      deck.hidden = false;
      paint();
      history.replaceState(null, "", "#present");
    }
    function exitPresent() {
      presenting = false;
      document.body.classList.remove("presenting");
      deck.hidden = true;
      if (location.hash === "#present") {
        history.replaceState(null, "", location.pathname + location.search);
      }
    }
    function next() {
      if (idx < SLIDES.length - 1) {
        idx++;
        paint();
      }
    }
    function prev() {
      if (idx > 0) {
        idx--;
        paint();
      }
    }

    document.getElementById("btn-present").addEventListener("click", () => enterPresent(0));
    document.getElementById("btn-exit").addEventListener("click", exitPresent);

    document.addEventListener("keydown", (e) => {
      if (e.key === "p" || e.key === "P") {
        if (e.target.matches("input, textarea, [contenteditable]")) return;
        e.preventDefault();
        if (presenting) exitPresent();
        else enterPresent(0);
        return;
      }
      if (!presenting) return;
      if (e.key === "Escape") {
        e.preventDefault();
        exitPresent();
      } else if (
        e.key === "ArrowDown" ||
        e.key === "ArrowRight" ||
        e.key === " " ||
        e.key === "PageDown"
      ) {
        e.preventDefault();
        next();
      } else if (e.key === "ArrowUp" || e.key === "ArrowLeft" || e.key === "PageUp") {
        e.preventDefault();
        prev();
      } else if (e.key === "Home") {
        e.preventDefault();
        idx = 0;
        paint();
      } else if (e.key === "End") {
        e.preventDefault();
        idx = SLIDES.length - 1;
        paint();
      } else if (e.key === "f" || e.key === "F") {
        e.preventDefault();
        if (!document.fullscreenElement) deck.requestFullscreen?.();
        else document.exitFullscreen?.();
      }
    });

    stage.addEventListener("click", (e) => {
      if (!presenting) return;
      const r = stage.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width;
      if (x < 0.3) prev();
      else next();
    });

    renderDoc();
    if (location.hash === "#present") enterPresent(0);
  </script>

  <button type="button" id="back-to-top" class="back-to-top" aria-label="Back to top" title="Back to top">↑</button>
  <script src="../style/deck-doc.js"></script>
</body>
</html>
